    <meta name="description" content="E-Waste Management & Recycling Optimization System - Enabling sustainable circular electronics disposal, verified drop-offs, and ecological tracking." />
    <title>EcoCycle | E-Waste Management &amp; Recycling Optimization System</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('ecocycle_theme') || 'system';
          var isDark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
